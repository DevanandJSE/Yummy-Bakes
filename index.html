<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yume Bakes</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        background-color: #ffe6f0;
        color: #5a3e36;
    }
    header {
        background-color: #ffb6c1;
        padding: 20px;
        text-align: center;
        border-bottom: 3px solid #f7a8b8;
    }
    header h1 {
        margin: 0;
        font-size: 2.5rem;
        font-family: 'Pacifico', cursive;
    }
    nav {
        margin-top: 10px;
    }
    nav a {
        text-decoration: none;
        color: #5a3e36;
        margin: 0 15px;
        font-weight: bold;
    }
    nav a:hover {
        color: #ff69b4;
    }
    .hero {
        text-align: center;
        padding: 50px 20px;
    }
    .hero img {
        max-width: 250px;
        border-radius: 50%;
        border: 5px solid #ffb6c1;
    }
    .hero h2 {
        font-size: 2rem;
        margin-top: 20px;
    }
    .products {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }
    .card {
        background-color: #fff0f5;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        width: 250px;
        text-align: center;
        padding: 15px;
    }
    .card img {
        width: 100%;
        border-radius: 10px;
    }
    footer {
        background-color: #ffb6c1;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<header>
    <h1>Yume Bakes</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <img src="https://via.placeholder.com/250x250.png?text=Yume+Bakes" alt="Yume Bakes Logo">
    <h2>Sweet Dreams in Every Bite 🍰</h2>
    <p>Freshly baked with love, just for you.</p>
</section>

<section class="products" id="menu">
    <div class="card">
        <img src="https://via.placeholder.com/250x200.png?text=Strawberry+Cake" alt="Strawberry Cake">
        <h3>Strawberry Cake</h3>
        <p>₹450</p>
    </div>
    <div class="card">
        <img src="https://via.placeholder.com/250x200.png?text=Macarons" alt="Macarons">
        <h3>Macarons</h3>
        <p>₹300</p>
    </div>
    <div class="card">
        <img src="https://via.placeholder.com/250x200.png?text=Cupcakes" alt="Cupcakes">
        <h3>Cupcakes</h3>
        <p>₹200</p>
    </div>
</section>

<footer id="contact">
    <p>📍 Chennai, India | 📞 +91 98765 43210 | 📧 yumebakes@example.com</p>
    <p>© 2026 Yume Bakes. All rights reserved.</p>
</footer>

</body>
</html>
